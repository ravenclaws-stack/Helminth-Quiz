<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HelminthoQuiz AI - Interactive Flashcard</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 18px; }

    header { text-align: center; margin-bottom: 6px; }
    header h1 { font-size: 1.6rem; color: var(--primary-dark); font-weight: 700; }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    /* Setup Bar */
    .config-card { background: var(--surface); padding: 14px 18px; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .api-box { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 280px; }
    .api-box input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.85rem; }
    .api-box button { padding: 8px 14px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }

    /* Upload Area */
    .upload-area { border: 2px dashed var(--border); background: var(--surface); border-radius: 12px; padding: 24px; text-align: center; cursor: pointer; transition: 0.2s; }
    .upload-area:hover { border-color: var(--primary); background: #eff6ff; }
    .upload-area input { display: none; }
    .upload-area span { color: var(--muted); font-size: 0.9rem; }

    /* Main Quiz Card */
    .quiz-card { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); overflow: hidden; display: none; flex-direction: column; }
    .quiz-card.active { display: flex; }

    .card-header { padding: 12px 20px; background: #f1f5f9; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; font-weight: 600; color: var(--muted); }

    .viewer-layout { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; padding: 20px; }
    @media (max-width: 768px) {
      .viewer-layout { grid-template-columns: 1fr; }
    }

    .image-preview-box { width: 100%; height: 350px; background: #000; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .image-preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .form-box { display: flex; flex-direction: column; gap: 12px; }
    .input-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
    .input-group input, .input-group textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; outline: none; }
    .input-group textarea { resize: none; height: 60px; }
    .input-group input:focus, .input-group textarea:focus { border-color: var(--primary); }

    .action-btn { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.92rem; }
    .action-btn:hover { background: var(--primary-dark); }
    .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Feedback Box */
    .feedback-box { display: none; margin-top: 8px; padding: 14px; border-radius: 10px; background: #f8fafc; border: 1px solid var(--border); font-size: 0.88rem; line-height: 1.45; }
    .feedback-box.show { display: block; }

    .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: #f8fafc; border-top: 1px solid var(--border); }
    .nav-btn { padding: 8px 16px; border: 1px solid var(--border); background: white; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .nav-btn:hover { background: #f1f5f9; }
    .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Platform Kuis Helmintologi AI</h1>
      <p>Upload preparat praktikum dan biarkan AI menguji ketepatan identifikasimu</p>
    </header>

    <div class="config-card">
      <div class="api-box">
        <input type="password" id="apiKeyInput" placeholder="Masukkan Gemini API Key...">
        <button onclick="saveApiKey()">Simpan Key</button>
      </div>
      <span id="apiStatus" style="font-size: 0.8rem; color: var(--muted);">Status: Belum ada Key</span>
    </div>

    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" multiple accept="image/*" onchange="handleFiles(this.files)">
      <b>Klik atau tarik file gambar preparat ke sini</b>
      <br>
      <span>Bisa pilih banyak gambar sekaligus (JPG, PNG)</span>
    </div>

    <div class="quiz-card" id="quizCard">
      <div class="card-header">
        <span id="fileNameDisplay">preparat.jpg</span>
        <span id="progressDisplay">1 / 10</span>
      </div>

      <div class="viewer-layout">
        <div class="image-preview-box">
          <img id="mainImage" src="" alt="Preparat Parasit">
        </div>

        <div class="form-box">
          <div class="input-group">
            <label>1. Nama Spesies Cacing</label>
            <input type="text" id="inputSpecies" placeholder="Contoh: Ascaris lumbricoides">
          </div>
          <div class="input-group">
            <label>2. Stadium</label>
            <input type="text" id="inputStage" placeholder="Contoh: Telur fertil / Dewasa jantan">
          </div>
          <div class="input-group">
            <label>3. Ciri Khusus Diagnostik</label>
            <textarea id="inputTraits" placeholder="Tuliskan 1-2 ciri mikroskopis yang terlihat..."></textarea>
          </div>

          <button class="action-btn" id="btnSubmit" onclick="submitToGemini()">Periksa Jawaban dengan AI</button>

          <div class="feedback-box" id="feedbackBox"></div>
        </div>
      </div>

      <div class="nav-bar">
        <button class="nav-btn" id="btnPrev" onclick="navigate(-1)">← Sebelumnya</button>
        <button class="nav-btn" id="btnNext" onclick="navigate(1)">Selanjutnya →</button>
      </div>
    </div>
  </div>

  <script>
    let images = [];
    let currentIndex = 0;
    let geminiKey = localStorage.getItem('GEMINI_API_KEY') || '';

    window.onload = () => {
      if (geminiKey) {
        document.getElementById('apiKeyInput').value = geminiKey;
        document.getElementById('apiStatus').textContent = "Status: Key tersimpan";
        document.getElementById('apiStatus').style.color = "var(--success)";
      }
    };

    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (!val) return alert("Silakan masukkan Gemini API Key terlebih dahulu.");
      geminiKey = val;
      localStorage.setItem('GEMINI_API_KEY', val);
      document.getElementById('apiStatus').textContent = "Status: Key tersimpan";
      document.getElementById('apiStatus').style.color = "var(--success)";
      alert("API Key berhasil disimpan!");
    }

    function handleFiles(fileList) {
      if (!fileList || fileList.length === 0) return;
      images = [];
      const files = Array.from(fileList);

      let loadedCount = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          images.push({
            name: file.name,
            dataUrl: e.target.result,
            base64: e.target.result.split(',')[1],
            mimeType: file.type || 'image/jpeg'
          });
          loadedCount++;
          if (loadedCount === files.length) {
            currentIndex = 0;
            document.getElementById('quizCard').classList.add('active');
            displayCurrentCard();
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function displayCurrentCard() {
      if (images.length === 0) return;
      const current = images[currentIndex];
      document.getElementById('mainImage').src = current.dataUrl;
      document.getElementById('fileNameDisplay').textContent = current.name;
      document.getElementById('progressDisplay').textContent = `${currentIndex + 1} / ${images.length}`;

      document.getElementById('inputSpecies').value = '';
      document.getElementById('inputStage').value = '';
      document.getElementById('inputTraits').value = '';
      
      const fb = document.getElementById('feedbackBox');
      fb.className = 'feedback-box';
      fb.innerHTML = '';

      document.getElementById('btnPrev').disabled = currentIndex === 0;
      document.getElementById('btnNext').disabled = currentIndex === images.length - 1;
    }

    function navigate(step) {
      const target = currentIndex + step;
      if (target >= 0 && target < images.length) {
        currentIndex = target;
        displayCurrentCard();
      }
    }

    async function submitToGemini() {
      if (!geminiKey) {
        return alert("Harap masukkan dan simpan Gemini API Key terlebih dulu.");
      }

      const species = document.getElementById('inputSpecies').value.trim();
      const stage = document.getElementById('inputStage').value.trim();
      const traits = document.getElementById('inputTraits').value.trim();

      if (!species && !stage) {
        return alert("Tuliskan minimal tebakan spesies atau stadiumnya.");
      }

      const btn = document.getElementById('btnSubmit');
      const fb = document.getElementById('feedbackBox');
      btn.disabled = true;
      btn.textContent = "AI sedang memeriksa...";
      fb.className = 'feedback-box show';
      fb.innerHTML = "<i>Menganalisis preparat dan membandingkan jawaban...</i>";

      const current = images[currentIndex];

      const promptText = `Kamu adalah dosen spesialis Parasitologi Kedokteran (Helmintologi).
Tugasmu adalah memeriksa jawaban mahasiswa berdasarkan gambar preparat yang dilampirkan.

Tebakan Mahasiswa:
- Spesies: "${species}"
- Stadium: "${stage}"
- Ciri Khusus: "${traits}"

Instruksi Pemeriksaan:
1. Identifikasi preparat pada gambar secara akurat (apakah Nematoda, Cestoda, atau Trematoda; apa spesiesnya, stadium apa).
2. Nyatakan apakah tebakan mahasiswa: BENAR, HAMPIR TEPAT, atau KELIRU.
3. Berikan kunci identifikasi yang benar: Nama Spesies, Stadium, dan 2 ciri diagnostik mikroskopis utamanya.
4. Tulis ulasan secara ringkas, to the point, dan suportif.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${geminiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                {
                  inlineData: {
                    mimeType: current.mimeType,
                    data: current.base64
                  }
                }
              ]
            }]
          })
        });

        const data = await response.json();
        if (data.error) {
          fb.innerHTML = `<span style="color:var(--danger)">Error API: ${data.error.message}</span>`;
        } else {
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Tidak ada respons dari AI.";
          fb.innerHTML = reply.replace(/\\n/g, '<br>');
        }
      } catch (err) {
        fb.innerHTML = `<span style="color:var(--danger)">Gagal menghubungi Gemini API: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Periksa Jawaban dengan AI";
      }
    }
  </script>
</body>
</html>
